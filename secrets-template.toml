# Copy this file to .streamlit/secrets.toml and fill in real values.
# .streamlit/secrets.toml is gitignored — never commit real secrets.

# Local development only: skip login and use the "Dev: act as" switcher.
# Do NOT set this in the deployed (Streamlit Cloud) secrets, or anyone could
# pick the admin role. Must appear before any [table] header to stay top-level.
dev_mode = true

[connections.postgresql]
url = "postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require"

# Required only for the DEPLOYED app (username/password login). Omit locally when
# dev_mode = true. Set these in the Streamlit Cloud "Secrets" box, not here.
#
# [authenticator]
# cookie_name = "diesel_auth"
# cookie_key = "a-random-string"
# cookie_expiry_days = 30
#
# One entry per person; the username (the table key) must be their email and
# match a row in the `users` table. Passwords are auto-hashed at runtime.
# [credentials.usernames."denver.so@gmail.com"]
# name = "Denver"
# email = "denver.so@gmail.com"
# password = "choose-a-password"
