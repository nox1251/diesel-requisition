# Copy this file to .streamlit/secrets.toml and fill in real values.
# .streamlit/secrets.toml is gitignored — never commit real secrets.

# Local development only: skip Google sign-in and use the "Dev: act as" switcher.
# Do NOT set this in the deployed (Streamlit Cloud) secrets, or anyone could
# pick the admin role. Must appear before any [table] header to stay top-level.
dev_mode = true

[connections.postgresql]
url = "postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require"

# Required only for the DEPLOYED app (Google OIDC sign-in). Omit locally when
# dev_mode = true. Set these in the Streamlit Cloud "Secrets" box, not here.
# [auth]
# redirect_uri = "https://your-app.streamlit.app/oauth2callback"
# cookie_secret = "a-long-random-string"
# client_id = "xxxxx.apps.googleusercontent.com"
# client_secret = "xxxxx"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
